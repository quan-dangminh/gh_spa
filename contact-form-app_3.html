<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Intake</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --ink: #1b1f23;
    --paper: #fbfaf7;
    --line: #d8d3c8;
    --accent: #2f5d50;
    --accent-soft: #e7efe9;
    --error: #b3452c;
    --muted: #6b6459;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 32px;
    margin: 0 0 6px 0;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 32px 0;
    line-height: 1.5;
  }
  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px 0;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.02em;
  }
  input, textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: inherit;
    font-size: 15px;
    margin-bottom: 18px;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }
  textarea { resize: vertical; min-height: 64px; }
  button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 3px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: #244a40; }
  button:disabled { background: var(--line); cursor: not-allowed; color: var(--muted); }
  .note {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }
  .status {
    padding: 12px 14px;
    border-radius: 3px;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .status.ok { background: var(--accent-soft); color: var(--accent); }
  .status.err { background: #f6e6e1; color: var(--error); }
  .entries { list-style: none; margin: 0; padding: 0; }
  .entries li {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .entries li:last-child { border-bottom: none; }
  .entry-name { font-weight: 600; font-size: 15px; }
  .entry-meta { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .config-toggle {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    cursor: pointer;
    margin-bottom: 20px;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script>
const { createClient } = supabase;

const root = document.getElementById('root');

let state = {
  configured: false,
  showConfig: true,
  supabaseUrl: '',
  supabaseKey: '',
  client: null,
  form: { name: '', email: '', address: '' },
  submitting: false,
  status: null, // {type: 'ok'|'err', msg: string}
  entries: [],
  loadingEntries: false,
};

function render() {
  root.innerHTML = `
    <div class="eyebrow">Intake · 001</div>
    <h1>Contact Details</h1>
    <p class="sub">Submit a name, email, and address. Entries are stored directly in your Supabase project.</p>

    ${state.showConfig ? renderConfig() : `<div class="config-toggle" id="toggleConfig">edit connection settings</div>`}

    ${state.configured ? renderForm() + renderEntries() : ''}
  `;

  attachHandlers();
}

function renderConfig() {
  return `
    <div class="card">
      <h2>Connect to Supabase</h2>
      <label for="supabaseUrl">Project URL</label>
      <input id="supabaseUrl" type="text" placeholder="https://xxxxx.supabase.co" value="${escapeAttr(state.supabaseUrl)}" />
      <label for="supabaseKey">Publishable key</label>
      <input id="supabaseKey" type="text" placeholder="sb_publishable_... (or legacy anon eyJhbGciOi...)" value="${escapeAttr(state.supabaseKey)}" />
      <button id="connectBtn">Connect</button>
      <p class="note">
        Find these in your Supabase dashboard under Project Settings → API Keys. Use the <strong>publishable key</strong> (starts with <code>sb_publishable_</code>) — Supabase's new client-side key, safe to expose in a web page. Older projects may still show a legacy <strong>anon</strong> key (a long JWT starting with <code>eyJ</code>) instead, which also works here. Never use a <strong>secret</strong> or <strong>service_role</strong> key in this app — those are backend-only and will not work in a browser.
        Kept in memory for this session only, never saved to disk.
      </p>
    </div>
  `;
}

function renderForm() {
  return `
    <div class="card">
      <h2>New Entry</h2>
      ${state.status ? `<div class="status ${state.status.type === 'ok' ? 'ok' : 'err'}">${escapeHtml(state.status.msg)}</div>` : ''}
      <label for="nameInput">Name</label>
      <input id="nameInput" type="text" placeholder="Jane Doe" value="${escapeAttr(state.form.name)}" />
      <label for="emailInput">Email</label>
      <input id="emailInput" type="email" placeholder="jane@example.com" value="${escapeAttr(state.form.email)}" />
      <label for="addressInput">Address</label>
      <textarea id="addressInput" placeholder="123 Main St, Springfield">${escapeHtml(state.form.address)}</textarea>
      <button id="submitBtn" ${state.submitting ? 'disabled' : ''}>${state.submitting ? 'Saving…' : 'Save entry'}</button>
    </div>
  `;
}

function renderEntries() {
  const items = state.entries.map(e => `
    <li>
      <div class="entry-name">${escapeHtml(e.name)}</div>
      <div class="entry-meta">${escapeHtml(e.email)} · ${escapeHtml(e.address)}</div>
    </li>
  `).join('');

  return `
    <div class="card">
      <h2>Recent Entries</h2>
      ${state.loadingEntries ? '<p class="empty">Loading…</p>' :
        (state.entries.length ? `<ul class="entries">${items}</ul>` : '<p class="empty">No entries yet.</p>')}
    </div>
  `;
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

function attachHandlers() {
  const toggle = document.getElementById('toggleConfig');
  if (toggle) toggle.addEventListener('click', () => { state.showConfig = true; render(); });

  const connectBtn = document.getElementById('connectBtn');
  if (connectBtn) connectBtn.addEventListener('click', handleConnect);

  const urlInput = document.getElementById('supabaseUrl');
  if (urlInput) urlInput.addEventListener('input', e => state.supabaseUrl = e.target.value);

  const keyInput = document.getElementById('supabaseKey');
  if (keyInput) keyInput.addEventListener('input', e => state.supabaseKey = e.target.value);

  const nameInput = document.getElementById('nameInput');
  if (nameInput) nameInput.addEventListener('input', e => state.form.name = e.target.value);

  const emailInput = document.getElementById('emailInput');
  if (emailInput) emailInput.addEventListener('input', e => state.form.email = e.target.value);

  const addressInput = document.getElementById('addressInput');
  if (addressInput) addressInput.addEventListener('input', e => state.form.address = e.target.value);

  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', handleSubmit);
}

async function handleConnect() {
  if (!state.supabaseUrl || !state.supabaseKey) {
    alert('Please enter both the project URL and anon key.');
    return;
  }
  try {
    const cleanUrl = state.supabaseUrl.trim().replace(/\/+$/, '');
    const cleanKey = state.supabaseKey.trim();
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cleanUrl)) {
      const proceed = confirm('That URL doesn\'t look like a typical Supabase project URL (expected something like https://xxxxx.supabase.co with no trailing slash or extra path). Continue anyway?');
      if (!proceed) return;
    }
    state.supabaseUrl = cleanUrl;
    state.client = createClient(cleanUrl, cleanKey);
    state.configured = true;
    state.showConfig = false;
    render();
    await loadEntries();
  } catch (err) {
    alert('Could not connect: ' + err.message);
  }
}

async function loadEntries() {
  state.loadingEntries = true;
  render();
  try {
    const { data, error } = await state.client
      .from('contacts')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) throw error;
    state.entries = data || [];
  } catch (err) {
    state.status = { type: 'err', msg: 'Could not load entries: ' + err.message };
  }
  state.loadingEntries = false;
  render();
}

async function handleSubmit() {
  const { name, email, address } = state.form;
  if (!name.trim() || !email.trim() || !address.trim()) {
    state.status = { type: 'err', msg: 'All three fields are required.' };
    render();
    return;
  }
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email.trim())) {
    state.status = { type: 'err', msg: 'Enter a valid email address.' };
    render();
    return;
  }

  state.submitting = true;
  state.status = null;
  render();

  try {
    const { error } = await state.client
      .from('contacts')
      .insert([{ name: name.trim(), email: email.trim(), address: address.trim() }]);
    if (error) throw error;

    state.status = { type: 'ok', msg: 'Entry saved.' };
    state.form = { name: '', email: '', address: '' };
    await loadEntries();
  } catch (err) {
    state.status = { type: 'err', msg: 'Save failed: ' + err.message };
  }
  state.submitting = false;
  render();
}

render();
</script>
</body>
</html>
