<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizFlow Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --sidebar-bg: #0f2036;
      --sidebar-bg-2: #152c46;
      --sidebar-text: #dfe8f4;
      --sidebar-muted: #a7b7d1;
      --panel-bg: #f4f6f8;
      --card-bg: #ffffff;
      --line: #dfe5ec;
      --muted: #6e7b8b;
      --text: #1f2d3d;
      --blue: #7bb8de;
      --blue-soft: #dfeefd;
      --green: #4ec194;
      --green-soft: #dcf7eb;
      --purple: #a783d6;
      --purple-soft: #efe5ff;
      --orange: #f1a96a;
      --orange-soft: #fdebd8;
      --shadow: 0 10px 28px rgba(17, 26, 38, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #edf1f5;
      color: var(--text);
    }

    .app {
      display: flex;
      min-height: 100vh;
      background: var(--panel-bg);
    }

    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
      color: var(--sidebar-text);
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 20px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #5b7ef6, #3bc0ff);
      border-radius: 7px;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 7px;
      transform: rotate(45deg);
    }

    .brand-mark::before {
      background: rgba(255,255,255,0.18);
      transform: scale(0.75) rotate(45deg);
    }

    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .nav {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: var(--sidebar-text);
      text-decoration: none;
      border-radius: 10px;
      opacity: 0.9;
      transition: 0.2s ease;
      font-size: 1.05rem;
    }

    .nav a.active {
      background: rgba(255,255,255,0.08);
      color: white;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .nav a:hover {
      background: rgba(255,255,255,0.05);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      opacity: 0.9;
      display: inline-block;
      position: relative;
    }

    .nav-icon.home::before { content: "⌂"; font-size: 18px; line-height: 18px; }
    .nav-icon.people::before { content: "◌"; font-size: 18px; }
    .nav-icon.customer::before { content: "◎"; font-size: 18px; }
    .nav-icon.box::before { content: "▣"; font-size: 18px; }
    .nav-icon.invoice::before { content: "◫"; font-size: 18px; }
    .nav-icon.report::before { content: "▤"; font-size: 18px; }
    .nav-icon.settings::before { content: "⚙"; font-size: 18px; }

    .nav-divider {
      margin: 14px 0 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .user-card {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 10px 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .logout-btn {
      margin-top: 12px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: var(--sidebar-text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9bc5ff, #3b8af8);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .user-card .name {
      font-size: 0.95rem;
      font-weight: 600;
      display: block;
      line-height: 1.2;
    }

    .user-card .mail {
      font-size: 0.72rem;
      color: var(--sidebar-muted);
      display: block;
      line-height: 1.2;
    }

    .main {
      flex: 1;
      padding: 26px 28px 30px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .title {
      font-size: clamp(2.1rem, 2vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      margin: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search {
      width: 300px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .search input {
      border: none;
      outline: none;
      flex: 1;
      background: transparent;
      font-size: 0.98rem;
      color: var(--text);
    }

    .icon-bell {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      position: relative;
      color: #3b4860;
      font-size: 1.1rem;
    }

    .icon-bell::before {
      content: "🔔";
      display: block;
      transform: scale(0.9);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px 26px 18px;
      min-height: 271px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .metric-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 2.3rem;
      line-height: 1;
      margin-bottom: 4px;
    }

    .metric-card.blue .metric-icon { background: var(--blue-soft); color: #1f96d3; }
    .metric-card.green .metric-icon { background: var(--green-soft); color: #2a9d69; }
    .metric-card.purple .metric-icon { background: var(--purple-soft); color: #7b5db1; }
    .metric-card.orange .metric-icon { background: var(--orange-soft); color: #d77b2e; }

    .metric-title {
      font-size: clamp(2.2rem, 2.2vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      margin: 0;
      color: var(--text);
    }

    .metric-desc {
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.5;
      margin: 0;
      max-width: 300px;
    }

    .metric-summary {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 6px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin: 0;
      line-height: 1.1;
    }

    .metric-change {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      justify-content: flex-end;
    }

    .metric-change.negative { color: #d15454; }

    .metric-change::before {
      content: "↑";
      font-size: 0.92rem;
      line-height: 1;
    }

    .metric-change.negative::before { content: "↓"; }

    .metric-subline {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 4px;
      text-align: right;
    }

    .metric-button {
      appearance: none;
      border: none;
      background: var(--blue-soft);
      color: #1c5e7b;
      width: 100%;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 18px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: inset 0 0 0 1px rgba(31,150,211,0.10);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .metric-card.green .metric-button {
      background: var(--green-soft);
      color: #2a9d69;
    }

    .metric-card.purple .metric-button {
      background: var(--purple-soft);
      color: #6948a6;
    }

    .metric-card.orange .metric-button {
      background: var(--orange-soft);
      color: #c96d1f;
    }

    .metric-button:hover { transform: translateY(-1px); }

    .bottom-strip {
      margin-top: 28px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      width: min(100%, 1020px);
    }

    .calendar-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text);
    }

    .calendar-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #eef2ff;
      border: 1px solid #dfe5ec;
      font-size: 1.35rem;
    }

    .date-main {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 2px;
    }

    .date-meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0;
    }

    @media (max-width: 980px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 18px; }
      .topbar-actions { width: 100%; justify-content: space-between; }
      .search { width: 100%; max-width: 420px; }
      .cards { grid-template-columns: 1fr; }
      .bottom-strip { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">BizFlow</div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a href="#" class="active"><span class="nav-icon home" aria-hidden="true"></span>Home</a>
        <a href="/employee"><span class="nav-icon people" aria-hidden="true"></span>Employees</a>
        <a href="/customers"><span class="nav-icon customer" aria-hidden="true"></span>Customers</a>
        <a href="/items"><span class="nav-icon box" aria-hidden="true"></span>Items</a>
        <a href="/invoices"><span class="nav-icon invoice" aria-hidden="true"></span>Invoices</a>
        <div class="nav-divider"></div>
        <a href="#"><span class="nav-icon report" aria-hidden="true"></span>Reports</a>
        <a href="#"><span class="nav-icon settings" aria-hidden="true"></span>Settings</a>
      </nav>

      <div class="user-card">
        <div class="avatar">A</div>
        <div>
          <span class="name">Admin User</span>
          <span class="mail">admin@bizflow.com</span>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 class="title">Welcome back, Admin!</h1>
          <p class="subtitle">Here's what's happening with your business today.</p>
        </div>

        <div class="topbar-actions">
          <label class="search" aria-label="Search">
            <span aria-hidden="true">⌕</span>
            <input type="text" placeholder="Search anything..." />
          </label>
          <div class="icon-bell" aria-label="Notifications"></div>
        </div>
      </div>

      <section class="cards" id="cards"></section>

      <div class="bottom-strip">
        <div class="calendar-wrap">
          <div class="calendar-icon" aria-hidden="true">📅</div>
          <div>
            <p class="date-main" id="todayDate">Today is May 24, 2024</p>
            <p class="date-meta">Have a productive day!</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const cardsRoot = document.getElementById('cards');
    const todayDate = document.getElementById('todayDate');

    function readCurrentUser() {
      try {
        const value = JSON.parse(localStorage.getItem('bizflow-current-user') || 'null');
        window.__CURRENT_USER__ = value || {};
        return value || null;
      } catch (error) {
        window.__CURRENT_USER__ = {};
        return null;
      }
    }

    function applyUserProfile() {
      const user = window.__CURRENT_USER__ || {};
      const fullName = user.fullName || user.name || user.email || 'User';
      const email = user.email || '';
      const initial = (fullName || 'U').trim().charAt(0).toUpperCase();

      const avatarEls = document.querySelectorAll('.avatar');
      avatarEls.forEach(el => { el.textContent = initial; });

      const nameEls = document.querySelectorAll('.user-card .name, .usercard .name');
      nameEls.forEach(el => { el.textContent = fullName; });

      const mailEls = document.querySelectorAll('.user-card .mail, .usercard .mail');
      mailEls.forEach(el => { el.textContent = email || 'No email'; });

      const titleEl = document.querySelector('.title');
      if (titleEl) {
        titleEl.textContent = `Welcome back, ${fullName}!`;
      }
    }

    function ensureAuthenticated() {
      const user = readCurrentUser();
      if (!user || !user.email || !user.name) {
        window.location.href = '/login';
        return null;
      }

      window.__CURRENT_USER__ = user;
      applyUserProfile();
      return user;
    }

    const defaultMetrics = [
      {
        key: 'employees',
        className: 'blue',
        icon: '👥',
        title: 'Employees',
        subtitle: "Manage your organization's employees and their information.",
        total: 24,
        change: 12,
        kind: 'count',
        href: '/employee',
        button: 'View Employees'
      },
      {
        key: 'customers',
        className: 'green',
        icon: '👥',
        title: 'Customers',
        subtitle: 'Manage your customers and their contact information.',
        total: 156,
        change: 8,
        kind: 'count',
        href: '/customers',
        button: 'View Customers'
      },
      {
        key: 'items',
        className: 'purple',
        icon: '▣',
        title: 'Items',
        subtitle: 'Track and manage your products and inventory.',
        total: 342,
        change: 15,
        kind: 'count',
        href: '/items',
        button: 'View Items'
      },
      {
        key: 'invoices',
        className: 'orange',
        icon: '📝',
        title: 'Invoices',
        subtitle: 'Create, view and manage your invoices.',
        total: 28540,
        change: 18,
        kind: 'currency',
        href: '/invoices',
        button: 'View Invoices'
      }
    ];

    function formatValue(metric) {
      if (metric.kind === 'currency') {
        return '$' + Number(metric.total).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      return metric.total.toLocaleString('en-US');
    }

    function formatChange(v) {
      const sign = v >= 0 ? '+' : '-';
      return `${sign}${Math.abs(v)}%`;
    }

    function renderCards(metrics) {
      cardsRoot.innerHTML = metrics.map(metric => `
        <article class="metric-card ${metric.className}">
          <div class="card-top">
            <div class="metric-icon" aria-hidden="true">${metric.icon}</div>
            <div>
              <h2 class="metric-title">${metric.title}</h2>
              <p class="metric-desc">${metric.subtitle}</p>
            </div>
          </div>

          <div class="metric-summary">
            <div>
              <p class="metric-value">${formatValue(metric)}</p>
            </div>
            <div>
              <div class="metric-change ${metric.change < 0 ? 'negative' : ''}">${formatChange(metric.change)}</div>
              <div class="metric-subline">vs last month</div>
            </div>
          </div>

          <a href="${metric.href}" class="metric-button">${metric.button} →</a>
        </article>
      `).join('');
    }

    function updateDateText() {
      const now = new Date();
      const options = { month: 'long', day: 'numeric', year: 'numeric' };
      todayDate.textContent = 'Today is ' + now.toLocaleDateString('en-US', options);
    }

    function bindLogout() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (!logoutBtn) return;
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('bizflow-current-user');
        window.location.href = '/login';
      });
    }

    async function loadDashboardMetrics() {
      const metrics = JSON.parse(JSON.stringify(defaultMetrics));
      const url = typeof window.ENV_SUPABASE_URL !== 'undefined' ? window.ENV_SUPABASE_URL : '';
      const key = typeof window.ENV_SUPABASE_KEY !== 'undefined' ? window.ENV_SUPABASE_KEY : '';

      if (!url || !key || typeof supabase === 'undefined') {
        renderCards(metrics);
        return;
      }

      try {
        const user = ensureAuthenticated();
        if (!user) return;

        const client = supabase.createClient(url, key);
        const [employeeRes, customerRes, itemRes, invoiceRes] = await Promise.all([
          client.from('employee').select('id', { count: 'exact' }),
          client.from('customers').select('id', { count: 'exact' }),
          client.from('items').select('id', { count: 'exact' }),
          client.from('invoices').select('total')
        ]);

        if (!employeeRes.error) metrics[0].total = employeeRes.count || employeeRes.data?.length || metrics[0].total;
        if (!customerRes.error) metrics[1].total = customerRes.count || customerRes.data?.length || metrics[1].total;
        if (!itemRes.error) metrics[2].total = itemRes.count || itemRes.data?.length || metrics[2].total;

        if (!invoiceRes.error && Array.isArray(invoiceRes.data)) {
          const totalValue = invoiceRes.data.reduce((sum, row) => sum + Number(row.total || 0), 0);
          metrics[3].total = totalValue || metrics[3].total;
        }
      } catch (err) {
        console.warn('Dashboard metric load failed:', err);
      }

      renderCards(metrics);
    }

    updateDateText();
    renderCards(defaultMetrics);
    bindLogout();
    loadDashboardMetrics();
  </script>
</body>
</html>
