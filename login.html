<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizFlow Login</title>
    <style>
      :root {
        --bg: #edf2f7;
        --card: #ffffff;
        --text: #1b2430;
        --muted: #69798c;
        --line: #dde6ef;
        --brand: #1f5eff;
        --brand-soft: #eaf1ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef5ff, #f5f7fb 40%, #edf2f7 100%);
        color: var(--text);
      }
      .login-shell {
        width: min(460px, calc(100vw - 32px));
      }
      .login-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(11, 30, 52, 0.08);
        padding: 32px 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: linear-gradient(135deg, #4f89ff, #5fe2ff);
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      }
      .brand-mark::before {
        content: '';
        position: absolute;
        inset: 0;
        transform: rotate(45deg) scale(.72);
        border-radius: 7px;
        background: rgba(255,255,255,0.18);
      }
      .brand-name {
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 2.5rem);
        letter-spacing: -0.06em;
        text-align: center;
      }
      .subtitle {
        margin: 0 0 26px;
        text-align: center;
        color: var(--muted);
        line-height: 1.5;
      }
      .login-form {
        display: grid;
        gap: 16px;
      }
      .field {
        display: grid;
        gap: 8px;
        text-align: left;
      }
      .field label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }
      .field input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font-size: 1rem;
      }
      .primary-btn {
        width: 100%;
        border: none;
        background: var(--brand);
        color: white;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        margin-top: 18px;
        min-height: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .status.error { color: #cd4a4a; }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <div class="login-card">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-name">BizFlow</div>
        </div>
        <h1>Welcome back</h1>
        <p class="subtitle">Enter your name and email to continue to the dashboard and manage employees, customers, items, and invoices.</p>
        <form id="loginForm" class="login-form">
          <div class="field">
            <label for="loginName">Full name</label>
            <input id="loginName" name="name" type="text" placeholder="Enter your full name" required />
          </div>
          <div class="field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="Enter your email" required />
          </div>
          <button class="primary-btn" type="submit">Continue</button>
        </form>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const form = document.getElementById('loginForm');
      const nameInput = document.getElementById('loginName');
      const emailInput = document.getElementById('loginEmail');

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', isError);
      }

      function getStoredUser() {
        try {
          return JSON.parse(localStorage.getItem('bizflow-current-user') || 'null');
        } catch (error) {
          return null;
        }
      }

      function saveUser(user) {
        localStorage.setItem('bizflow-current-user', JSON.stringify(user));
      }

      function initLoginPage() {
        const stored = getStoredUser();
        if (stored) {
          window.location.href = '/home';
          return;
        }

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const name = nameInput.value.trim();
          const email = emailInput.value.trim();

          if (!name || !email) {
            setStatus('Please enter both your name and email.', true);
            return;
          }

          const user = {
            fullName: name,
            name,
            email
          };

          saveUser(user);
          window.location.href = '/home';
        });
      }

      initLoginPage();
    </script>
  </body>
</html>
