<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizFlow Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">BizFlow</div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a href="#" class="active"><span class="nav-icon home" aria-hidden="true"></span>Home</a>
        <a href="/employee"><span class="nav-icon people" aria-hidden="true"></span>Employees</a>
        <a href="/customers"><span class="nav-icon customer" aria-hidden="true"></span>Customers</a>
        <a href="/items"><span class="nav-icon box" aria-hidden="true"></span>Items</a>
        <a href="/invoices"><span class="nav-icon invoice" aria-hidden="true"></span>Invoices</a>
        <div class="nav-divider"></div>
        <a href="#"><span class="nav-icon report" aria-hidden="true"></span>Reports</a>
        <a href="#"><span class="nav-icon settings" aria-hidden="true"></span>Settings</a>
      </nav>

      <div class="user-card">
        <div class="avatar">A</div>
        <div>
          <span class="name">Admin User</span>
          <span class="mail">admin@bizflow.com</span>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 class="title">Welcome back, Admin!</h1>
          <p class="subtitle">Here's what's happening with your business today.</p>
        </div>

        <div class="topbar-actions">
          <div class="icon-bell" aria-label="Notifications"></div>
        </div>
      </div>

      <section class="cards" id="cards"></section>

      <div class="bottom-strip">
        <div class="calendar-wrap">
          <div class="calendar-icon" aria-hidden="true">📅</div>
          <div>
            <p class="date-main" id="todayDate">Today is May 24, 2024</p>
            <p class="date-meta">Have a productive day!</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const cardsRoot = document.getElementById('cards');
    const todayDate = document.getElementById('todayDate');

    function readCurrentUser() {
      try {
        const value = JSON.parse(localStorage.getItem('bizflow-current-user') || 'null');
        window.__CURRENT_USER__ = value || {};
        return value || null;
      } catch (error) {
        window.__CURRENT_USER__ = {};
        return null;
      }
    }

    function applyUserProfile() {
      const user = window.__CURRENT_USER__ || {};
      const fullName = user.fullName || user.name || user.email || 'User';
      const email = user.email || '';
      const initial = (fullName || 'U').trim().charAt(0).toUpperCase();

      const avatarEls = document.querySelectorAll('.avatar');
      avatarEls.forEach(el => { el.textContent = initial; });

      const nameEls = document.querySelectorAll('.user-card .name, .usercard .name');
      nameEls.forEach(el => { el.textContent = fullName; });

      const mailEls = document.querySelectorAll('.user-card .mail, .usercard .mail');
      mailEls.forEach(el => { el.textContent = email || 'No email'; });

      const titleEl = document.querySelector('.title');
      if (titleEl) {
        titleEl.textContent = `Welcome back, ${fullName}!`;
      }
    }

    function ensureAuthenticated() {
      const user = readCurrentUser();
      if (!user || !user.email || !user.name) {
        window.location.href = '/login';
        return null;
      }

      window.__CURRENT_USER__ = user;
      applyUserProfile();
      return user;
    }

    const defaultMetrics = [
      {
        key: 'employees',
        className: 'blue',
        icon: '👥',
        title: 'Employees',
        subtitle: "Manage your organization's employees and their information.",
        total: '-',
        change: 12,
        kind: 'count',
        href: '/employee',
        button: 'View Employees'
      },
      {
        key: 'customers',
        className: 'green',
        icon: '👥',
        title: 'Customers',
        subtitle: 'Manage your customers and their contact information.',
        total: '-',
        change: 8,
        kind: 'count',
        href: '/customers',
        button: 'View Customers'
      },
      {
        key: 'items',
        className: 'purple',
        icon: '▣',
        title: 'Items',
        subtitle: 'Track and manage your products and inventory.',
        total: '-',
        change: 15,
        kind: 'count',
        href: '/items',
        button: 'View Items'
      },
      {
        key: 'invoices',
        className: 'orange',
        icon: '📝',
        title: 'Invoices',
        subtitle: 'Create, view and manage your invoices.',
        total: 0,
        change: 18,
        kind: 'currency',
        href: '/invoices',
        button: 'View Invoices'
      }
    ];

    function formatValue(metric) {
      if (metric.kind === 'currency') {
        return '$' + Number(metric.total).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      return metric.total.toLocaleString('en-US');
    }

    function formatChange(v) {
      const sign = v >= 0 ? '+' : '-';
      return `${sign}${Math.abs(v)}%`;
    }

    function renderCards(metrics) {
      cardsRoot.innerHTML = metrics.map(metric => `
        <article class="metric-card ${metric.className}">
          <div class="card-top">
            <div class="metric-icon" aria-hidden="true">${metric.icon}</div>
            <div>
              <h2 class="metric-title">${metric.title}</h2>
              <p class="metric-desc">${metric.subtitle}</p>
            </div>
          </div>

          <div class="metric-summary">
            <div>
              <p class="metric-value">${formatValue(metric)}</p>
            </div>
            <div>
              <div class="metric-change ${metric.change < 0 ? 'negative' : ''}">${formatChange(metric.change)}</div>
              <div class="metric-subline">vs last month</div>
            </div>
          </div>

          <a href="${metric.href}" class="metric-button">${metric.button} →</a>
        </article>
      `).join('');
    }

    function updateDateText() {
      const now = new Date();
      const options = { month: 'long', day: 'numeric', year: 'numeric' };
      todayDate.textContent = 'Today is ' + now.toLocaleDateString('en-US', options);
    }

    function bindLogout() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (!logoutBtn) return;
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('bizflow-current-user');
        window.location.href = '/login';
      });
    }

    async function loadDashboardMetrics() {
      const metrics = JSON.parse(JSON.stringify(defaultMetrics));
      const url = typeof window.ENV_SUPABASE_URL !== 'undefined' ? window.ENV_SUPABASE_URL : '';
      const key = typeof window.ENV_SUPABASE_KEY !== 'undefined' ? window.ENV_SUPABASE_KEY : '';

      if (!url || !key || typeof supabase === 'undefined') {
        renderCards(metrics);
        return;
      }

      try {
        const user = ensureAuthenticated();
        if (!user) return;

        const client = supabase.createClient(url, key);
        const [employeeRes, customerRes, itemRes, invoiceRes] = await Promise.all([
          client.from('employee').select('id', { count: 'exact' }),
          client.from('customers').select('id', { count: 'exact' }),
          client.from('items').select('id', { count: 'exact' }),
          client.from('invoices').select('total')
        ]);

        if (!employeeRes.error) metrics[0].total = employeeRes.count || employeeRes.data?.length || metrics[0].total;
        if (!customerRes.error) metrics[1].total = customerRes.count || customerRes.data?.length || metrics[1].total;
        if (!itemRes.error) metrics[2].total = itemRes.count || itemRes.data?.length || metrics[2].total;

        if (!invoiceRes.error && Array.isArray(invoiceRes.data)) {
          const totalValue = invoiceRes.data.reduce((sum, row) => sum + Number(row.total || 0), 0);
          metrics[3].total = totalValue || metrics[3].total;
        }
      } catch (err) {
        console.warn('Dashboard metric load failed:', err);
      }

      renderCards(metrics);
    }

    updateDateText();
    renderCards(defaultMetrics);
    bindLogout();
    loadDashboardMetrics();
  </script>
</body>
</html>
