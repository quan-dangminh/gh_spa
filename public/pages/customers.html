<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-name">GH Spa & Beauty</div>
      </div>
      <nav class="nav">
        <a href="/"><span class="nav-icon">⌂</span>Dashboard</a>
        <a href="/employee"><span class="nav-icon">👥</span>Employees</a>
        <a href="/customers" class="active"><span class="nav-icon">👤</span>Customers</a>
        <a href="/items"><span class="nav-icon">▣</span>Items</a>
        <a href="/invoices"><span class="nav-icon">🧾</span>Invoices</a>
        <div class="divider"></div>
        <a href="#"><span class="nav-icon">▤</span>Reports</a>
        <a href="#"><span class="nav-icon">⚙</span>Settings</a>
      </nav>
      <div class="usercard">
        <div class="avatar">A</div>
        <div>
          <div class="name">Admin User</div>
          <div class="mail">admin@bizflow.com</div>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </aside>

    <main class="content">
      <div class="toolbar">
        <h1>Customers</h1>
        <div class="actions">
          <label class="search"><span>⌕</span><input id="searchInput" placeholder="Search customers..." /></label>
          <button class="primary-btn" id="addBtn">+ Add Customer</button>
        </div>
      </div>

      <div class="workspace">
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Gender</th>
                <th>Description</th>
                <th>Created By</th>
                <!-- <th style="width: 130px;">Actions</th> -->
              </tr>
            </thead>
            <tbody id="rowsBody"></tbody>
          </table>
        </div>

        <aside class="detail-card" id="detailCard">
          <div class="detail-empty">Select a customer to view details and actions.</div>
        </aside>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Add Customer</h2>
        <button class="close-btn" id="closeModalBtn" aria-label="Close">×</button>
      </div>
      <form id="customerForm">
        <div class="form-grid">
          <div class="form-field">
            <label>Customer Name</label>
            <input name="name" required />
          </div>
          <div class="form-field">
            <label>Phone</label>
            <input name="phone" />
          </div>
          <div class="form-field full">
            <label>Address</label>
            <input name="address" />
          </div>
          <div class="form-field">
            <label>Email</label>
            <input name="email" type="email" />
          </div>
          <div class="form-field">
            <label>Gender</label>
            <select name="gender">
              <option value="">(select)</option>
              <option>Nam</option>
              <option>Nữ</option>
              <option>Khác</option>
            </select>
          </div>
          <div class="form-field">
            <label>Created By</label>
            <input name="created_by" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const { createClient } = supabase;
    let client = null;
    let state = { rows: [], selectedId: null, editingId: null, modalOpen: false, search: '' };

    function readCurrentUser() {
      try {
        const value = JSON.parse(localStorage.getItem('bizflow-current-user') || 'null');
        window.__CURRENT_USER__ = value || {};
        return value || null;
      } catch (error) {
        window.__CURRENT_USER__ = {};
        return null;
      }
    }

    function applyUserProfile() {
      const user = window.__CURRENT_USER__ || {};
      const fullName = user.fullName || user.name || user.email || 'User';
      const email = user.email || '';
      const initials = (fullName || 'U').trim().charAt(0).toUpperCase();

      document.querySelectorAll('.avatar, .usercard .avatar, .user-card .avatar').forEach(el => { el.textContent = initials; });
      document.querySelectorAll('.usercard .name, .user-card .name').forEach(el => { el.textContent = fullName; });
      document.querySelectorAll('.usercard .mail, .user-card .mail').forEach(el => { el.textContent = email || 'No email'; });
    }

    function getCurrentUserLabel() {
      const user = window.__CURRENT_USER__ || {};
      return (user.fullName || user.name || user.email || 'User').trim();
    }

    function ensureAuthenticated() {
      const user = readCurrentUser();
      if (!user || !user.email || !user.name) {
        window.location.href = '/login';
        return null;
      }
      window.__CURRENT_USER__ = user;
      applyUserProfile();
      return user;
    }

    function setStatus(msg) {
      document.getElementById('detailCard').innerHTML = '<div class="detail-empty">' + escapeHtml(msg) + '</div>';
    }

    async function connect(url, key) {
      const user = ensureAuthenticated();
      if (!user) return;
      client = createClient((url || '').trim().replace(/\/+$/, ''), (key || '').trim());
      await loadRows();
    }

    function bindLogout() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (!logoutBtn) return;
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('bizflow-current-user');
        window.location.href = '/login';
      });
    }

    async function loadRows() {
      if (!client) return;
      try {
        const { data, error } = await client.from('customers').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        state.rows = data || [];
        if (!state.rows.length) state.selectedId = null;
        else if (!state.selectedId || !state.rows.some(r => String(r.id) === String(state.selectedId))) state.selectedId = state.rows[0].id;
        renderTable();
        renderDetail();
      } catch (err) {
        setStatus('Could not load customers: ' + err.message);
      }
    }

    function renderTable() {
      const rowsBody = document.getElementById('rowsBody');
      const filtered = state.rows.filter(row => {
        const text = [row.name, row.phone, row.email, row.gender, row.address, row.created_by].join(' ').toLowerCase();
        return text.includes(state.search.trim().toLowerCase());
      });
      if (!filtered.length) {
        rowsBody.innerHTML = '<tr><td colspan="7" style="padding:20px;color:#69798c;">No customers found.</td></tr>';
        return;
      }
      rowsBody.innerHTML = filtered.map((row) => `
        <tr data-id="${row.id}" style="${String(state.selectedId) === String(row.id) ? 'background:#f7fbff;' : ''}">
          <td><strong>${escapeHtml(row.name || '—')}</strong></td>
          <td>${escapeHtml(row.phone || '—')}</td>
          <td>${escapeHtml(row.email || '—')}</td>
          <td>${escapeHtml(row.gender || '—')}</td>
          <td>${escapeHtml(row.description || '—')}</td>
          <td>${escapeHtml(row.created_by || '—')}</td>
        </tr>
      `).join('');

      rowsBody.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        state.selectedId = tr.dataset.id;
        renderTable();
        renderDetail();
      }));
      rowsBody.querySelectorAll('button[data-action="delete"]').forEach(btn => btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Warning: Deleting this customer is permanent. Continue?')) return;
        try {
          const { error } = await client.from('customers').delete().eq('id', btn.dataset.id);
          if (error) throw error;
          await loadRows();
        } catch (err) { alert('Delete failed: ' + err.message); }
      }));
    }

    function renderDetail() {
      const detailCard = document.getElementById('detailCard');
      const selected = state.rows.find(r => String(r.id) === String(state.selectedId));
      if (!selected) {
        detailCard.innerHTML = '<div class="detail-empty">Select a customer to view details and actions.</div>';
        return;
      }
      detailCard.innerHTML = `
        <div class="detail-header">
          <h3>${escapeHtml(selected.name || 'Customer')}</h3>
        </div>
        <div class="detail-info-grid">
          <div class="field"><span class="field-label">Name</span><span class="field-value">${escapeHtml(selected.name || '—')}</span></div>
          <div class="field"><span class="field-label">Phone</span><span class="field-value">${escapeHtml(selected.phone || '—')}</span></div>
          <div class="field full" style="grid-column:1 / -1;"><span class="field-label">Address</span><span class="field-value">${escapeHtml(selected.address || '—')}</span></div>
          <div class="field"><span class="field-label">Email</span><span class="field-value">${escapeHtml(selected.email || '—')}</span></div>
          <div class="field"><span class="field-label">Gender</span><span class="field-value">${escapeHtml(selected.gender || '—')}</span></div>
          <div class="field"><span class="field-label">Created By</span><span class="field-value">${escapeHtml(selected.created_by || '—')}</span></div>
          <div class="field"><span class="field-label">Created</span><span class="field-value">${selected.created_at ? new Date(selected.created_at).toLocaleDateString() : '—'}</span></div>
        </div>
        <div class="panel-actions">
          <button class="secondary-btn" id="detailEditFooterBtn">Edit</button>
          <button class="danger-btn" id="detailDeleteBtn">Delete</button>
        </div>
      `;
      document.getElementById('detailEditFooterBtn').addEventListener('click', () => openModal('Edit Customer', selected.id));
      document.getElementById('detailDeleteBtn').addEventListener('click', async () => {
        if (!confirm('Warning: Deleting this customer is permanent. Continue?')) return;
        try {
          const { error } = await client.from('customers').delete().eq('id', selected.id);
          if (error) throw error;
          await loadRows();
        } catch (err) { alert('Delete failed: ' + err.message); }
      });
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function openModal(title, id = null) {
      const modal = document.getElementById('modal');
      const form = document.getElementById('customerForm');
      const row = state.rows.find(r => String(r.id) === String(id));
      document.getElementById('modalTitle').textContent = title;
      state.editingId = id;
      form.name.value = row ? (row.name || '') : '';
      form.phone.value = row ? (row.phone || '') : '';
      form.address.value = row ? (row.address || '') : '';
      form.email.value = row ? (row.email || '') : '';
      form.gender.value = row ? (row.gender || '') : '';
      form.created_by.value = row ? (row.created_by || getCurrentUserLabel()) : getCurrentUserLabel();
      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      state.editingId = null;
      document.getElementById('customerForm').reset();
    }

    async function submitCustomer(e) {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        address: form.address.value.trim(),
        email: form.email.value.trim(),
        gender: form.gender.value,
        created_by: form.created_by.value.trim()
      };
      if (!payload.name) { alert('Name is required.'); return; }
      const proceed = confirm(state.editingId ? 'Warning: Saving changes will update this customer record. Continue?' : 'Warning: Creating this customer will add a new record. Continue?');
      if (!proceed) return;
      try {
        if (state.editingId) {
          const { error } = await client.from('customers').update(payload).eq('id', state.editingId);
          if (error) throw error;
        } else {
          const { error } = await client.from('customers').insert([payload]);
          if (error) throw error;
        }
        closeModal();
        await loadRows();
      } catch (err) { alert('Save failed: ' + err.message); }
    }

    document.getElementById('addBtn').addEventListener('click', () => openModal('Add Customer'));
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
    document.getElementById('customerForm').addEventListener('submit', submitCustomer);
    document.getElementById('searchInput').addEventListener('input', (e) => { state.search = e.target.value; renderTable(); });
    bindLogout();

    function autoConnect() {
      if (typeof window.ENV_SUPABASE_URL !== 'undefined' && typeof window.ENV_SUPABASE_KEY !== 'undefined') {
        const url = window.ENV_SUPABASE_URL;
        const key = window.ENV_SUPABASE_KEY;
        if (url && key) {
          connect(url, key).catch(err => setStatus('Auto-connect failed: ' + err.message));
          return;
        }
      }
      setStatus('Supabase is not configured on the server. Set SUPABASE_PROJECT_URL and SUPABASE_PUBLISHABLE_KEY in the .env file.');
    }

    autoConnect();
  </script>
</body>
</html>
