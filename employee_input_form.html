<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employees</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --sidebar-bg: #101f33;
      --sidebar-bg-2: #172c4a;
      --sidebar-text: #dfeaf8;
      --sidebar-muted: #9eb4d0;
      --page-bg: #eef2f5;
      --panel-bg: #f9fafb;
      --card-bg: #fff;
      --border: #e3e8ef;
      --text: #1f2f3f;
      --muted: #69798c;
      --accent: #4d9ad6;
      --accent-soft: #e5f2ff;
      --danger: #d76161;
      --danger-soft: #fff0f0;
      --success: #3ab67d;
      --success-soft: #eafaf3;
      --shadow: 0 8px 22px rgba(16, 31, 51, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--page-bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 230px; background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg-2)); color: var(--sidebar-text); padding: 18px 16px 14px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .brand-mark { width: 22px; height: 22px; border-radius: 8px; background: linear-gradient(135deg, #4f89ff, #5fe2ff); position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
    .brand-mark::before { content: ''; position: absolute; inset: 0; transform: rotate(45deg) scale(.72); border-radius: 7px; background: rgba(255,255,255,0.15); }
    .brand-name { font-size: 1.1rem; font-weight: 700; }
    .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: var(--sidebar-text); opacity: 0.9; }
    .nav a.active { background: rgba(255,255,255,0.08); }
    .nav-icon { width: 18px; text-align: center; color: var(--sidebar-muted); }
    .divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 12px 0; }
    .usercard { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px 8px 4px; border-top: 1px solid rgba(255,255,255,0.08); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #a8cffc, #5a96ff); display: grid; place-items: center; color: #fff; font-weight: 700; }
    .name { font-size: 0.92rem; font-weight: 700; }
    .mail { font-size: 0.73rem; color: var(--sidebar-muted); }
    .content { flex: 1; padding: 28px 26px 22px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .toolbar h1 { margin: 0; font-size: 2.1rem; letter-spacing: -0.05em; }
    .actions { display: flex; align-items: center; gap: 16px; }
    .search { display: flex; align-items: center; gap: 8px; width: 260px; background: rgba(255,255,255,0.7); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--muted); }
    .search input { width: 100%; border: none; outline: none; background: transparent; font-size: 0.95rem; }
    .primary-btn, .secondary-btn, .danger-btn { border: none; border-radius: 10px; padding: 11px 18px; font-size: 0.96rem; font-weight: 700; cursor: pointer; }
    .primary-btn { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(77,154,214,0.25); }
    .secondary-btn { background: var(--accent-soft); color: var(--accent); }
    .danger-btn { background: var(--danger-soft); color: var(--danger); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.7fr); gap: 18px; }
    .table-card, .detail-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
    .table-card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: #f8fafc; border-bottom: 1px solid var(--border); padding: 12px 14px; }
    tbody td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 0.96rem; }
    tbody tr:hover { background: #fafcff; }
    .status-pill { display: inline-flex; align-items: center; justify-content: center; padding: 5px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .status-pill.active { background: var(--success-soft); color: var(--success); }
    .status-pill.inactive { background: #f4f5f7; color: var(--muted); }
    .row-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .mini-btn { border: none; padding: 7px 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .mini-btn.edit { background: var(--accent-soft); color: var(--accent); }
    .mini-btn.delete { background: var(--danger-soft); color: var(--danger); }
    .detail-card { min-height: 420px; padding: 18px; }
    .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .detail-header h3 { margin: 0; font-size: 1.08rem; }
    .detail-body { display: grid; gap: 12px; }
    .avatar-big { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #dfeeff, #80b0e6); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 1.3rem; }
    .detail-empty { color: var(--muted); line-height: 1.6; }
    .detail-info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { background: #f7f9fb; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .field-label { display: block; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .field-value { font-weight: 700; color: var(--text); }
    .panel-actions { display: flex; gap: 8px; margin-top: 12px; }
    .panel-actions .secondary-btn { flex: 1; }
    .panel-actions .danger-btn { flex: 1; }
    .modal { position: fixed; inset: 0; background: rgba(15, 23, 31, 0.46); display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { width: min(720px, 100%); background: white; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,0.2); padding: 20px 22px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-header h2 { margin: 0; font-size: 1.5rem; letter-spacing: -0.04em; }
    .close-btn { border: none; background: transparent; font-size: 1.7rem; color: var(--muted); cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
    .form-field input, .form-field select { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.96rem; background: #fdfdfd; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    @media (max-width: 980px) { .workspace { grid-template-columns: 1fr; } .toolbar { flex-wrap: wrap; gap: 12px; } .actions { width: 100%; justify-content: space-between; } .search { flex: 1; max-width: 320px; } }
    @media (max-width: 760px) { .app { flex-direction: column; } .sidebar { width: 100%; } .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-name">BizManager</div>
      </div>
      <nav class="nav">
        <a href="/"><span class="nav-icon">⌂</span>Dashboard</a>
        <a href="/employee" class="active"><span class="nav-icon">👥</span>Employees</a>
        <a href="/customers"><span class="nav-icon">👤</span>Customers</a>
        <a href="/items"><span class="nav-icon">▣</span>Items</a>
        <a href="/invoices"><span class="nav-icon">🧾</span>Invoices</a>
        <div class="divider"></div>
        <a href="#"><span class="nav-icon">▤</span>Reports</a>
        <a href="#"><span class="nav-icon">⚙</span>Settings</a>
      </nav>
      <div class="usercard">
        <div class="avatar">A</div>
        <div>
          <div class="name">Admin User</div>
          <div class="mail">admin@bizflow.com</div>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <h1>Employees</h1>
        <div class="actions">
          <label class="search"><span>⌕</span><input id="searchInput" placeholder="Search employees..." /></label>
          <button class="primary-btn" id="addBtn">+ Add Employee</button>
        </div>
      </div>

      <div class="workspace">
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Status</th>
                <th style="width: 130px;">Actions</th>
              </tr>
            </thead>
            <tbody id="rowsBody"></tbody>
          </table>
        </div>

        <aside class="detail-card" id="detailCard">
          <div class="detail-empty">Select an employee to view details and actions.</div>
        </aside>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Add Employee</h2>
        <button class="close-btn" id="closeModalBtn" aria-label="Close">×</button>
      </div>
      <form id="employeeForm">
        <div class="form-grid">
          <div class="form-field">
            <label>Full Name</label>
            <input name="name" required />
          </div>
          <div class="form-field">
            <label>Department</label>
            <input name="jobTitle" required />
          </div>
          <div class="form-field">
            <label>Phone</label>
            <input name="phone" />
          </div>
          <div class="form-field">
            <label>Email</label>
            <input name="email" type="email" />
          </div>
          <div class="form-field full">
            <label>Address</label>
            <input name="address" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const { createClient } = supabase;
    let client = null;
    let state = {
      rows: [],
      selectedId: null,
      modalOpen: false,
      editingId: null,
      search: ''
    };

    function setStatus(msg) {
      const detailCard = document.getElementById('detailCard');
      detailCard.innerHTML = '<div class="detail-empty">' + escapeHtml(msg) + '</div>';
    }

    async function connect(url, key) {
      client = createClient((url || '').trim().replace(/\/+$/, ''), (key || '').trim());
      await loadRows();
    }

    async function loadRows() {
      if (!client) return;
      try {
        const { data, error } = await client.from('employee').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        state.rows = data || [];
        if (!state.rows.length) {
          state.selectedId = null;
        } else if (!state.selectedId || !state.rows.some(r => String(r.id) === String(state.selectedId))) {
          state.selectedId = state.rows[0].id;
        }
        renderTable();
        renderDetail();
      } catch (err) {
        setStatus('Could not load employees: ' + err.message);
      }
    }

    function renderTable() {
      const rowsBody = document.getElementById('rowsBody');
      const search = state.search.trim().toLowerCase();
      const filtered = state.rows.filter(row => {
        const haystack = [row.name, row.jobTitle, row.phone, row.email].join(' ').toLowerCase();
        return haystack.includes(search);
      });

      if (!filtered.length) {
        rowsBody.innerHTML = '<tr><td colspan="6" style="padding:20px;color:#69798c;">No employees found.</td></tr>';
        return;
      }

      rowsBody.innerHTML = filtered.map((row) => `
        <tr data-id="${row.id}" class="${String(state.selectedId) === String(row.id) ? 'selected-row' : ''}" style="${String(state.selectedId) === String(row.id) ? 'background:#f7fbff;' : ''}">
          <td><strong>${escapeHtml(row.name || '—')}</strong></td>
          <td>${escapeHtml(row.jobTitle || '—')}</td>
          <td>${escapeHtml(row.phone || '—')}</td>
          <td>${escapeHtml(row.email || '—')}</td>
          <td><span class="status-pill ${row.active === false ? 'inactive' : 'active'}">${row.active === false ? 'Inactive' : 'Active'}</span></td>
          <td>
            <div class="row-actions">
              <button class="mini-btn edit" data-action="edit" data-id="${row.id}">Edit</button>
              <button class="mini-btn delete" data-action="delete" data-id="${row.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      rowsBody.querySelectorAll('tr[data-id]').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          state.selectedId = row.dataset.id;
          renderTable();
          renderDetail();
        });
      });

      rowsBody.querySelectorAll('button[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          openModal('Edit Employee', id);
        });
      });

      rowsBody.querySelectorAll('button[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (!confirm('Warning: Deleting this employee is permanent. Continue?')) return;
          try {
            const { error } = await client.from('employee').delete().eq('id', id);
            if (error) throw error;
            await loadRows();
          } catch (err) { alert('Delete failed: ' + err.message); }
        });
      });
    }

    function renderDetail() {
      const detailCard = document.getElementById('detailCard');
      const selected = state.rows.find(row => String(row.id) === String(state.selectedId));
      if (!selected) {
        detailCard.innerHTML = '<div class="detail-empty">Select an employee to view details and actions.</div>';
        return;
      }

      detailCard.innerHTML = `
        <div class="detail-header">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="avatar-big">${escapeHtml((selected.name || 'E').charAt(0).toUpperCase())}</div>
            <div>
              <h3>${escapeHtml(selected.name || 'Employee')}</h3>
            </div>
          </div>
          <button class="secondary-btn" id="detailEditBtn">Edit</button>
        </div>
        <div class="detail-body">
          <div class="detail-info-grid">
            <div class="field"><span class="field-label">Employee ID</span><span class="field-value">${escapeHtml(selected.id || '—')}</span></div>
            <div class="field"><span class="field-label">Department</span><span class="field-value">${escapeHtml(selected.jobTitle || '—')}</span></div>
            <div class="field"><span class="field-label">Phone</span><span class="field-value">${escapeHtml(selected.phone || '—')}</span></div>
            <div class="field"><span class="field-label">Email</span><span class="field-value">${escapeHtml(selected.email || '—')}</span></div>
            <div class="field full" style="grid-column: 1 / -1;"><span class="field-label">Address</span><span class="field-value">${escapeHtml(selected.address || '—')}</span></div>
            <div class="field"><span class="field-label">Created</span><span class="field-value">${selected.created_at ? new Date(selected.created_at).toLocaleDateString() : '—'}</span></div>
            <div class="field"><span class="field-label">Status</span><span class="field-value">${selected.active === false ? 'Inactive' : 'Active'}</span></div>
          </div>
          <div class="panel-actions">
            <button class="secondary-btn" id="detailEditFooterBtn">Edit</button>
            <button class="danger-btn" id="detailDeleteBtn">Delete</button>
          </div>
        </div>
      `;

      document.getElementById('detailEditBtn').addEventListener('click', () => openModal('Edit Employee', selected.id));
      document.getElementById('detailEditFooterBtn').addEventListener('click', () => openModal('Edit Employee', selected.id));
      document.getElementById('detailDeleteBtn').addEventListener('click', async () => {
        if (!confirm('Warning: Deleting this employee is permanent. Continue?')) return;
        try {
          const { error } = await client.from('employee').delete().eq('id', selected.id);
          if (error) throw error;
          await loadRows();
        } catch (err) { alert('Delete failed: ' + err.message); }
      });
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function openModal(title, id = null) {
      const modal = document.getElementById('modal');
      const titleEl = document.getElementById('modalTitle');
      titleEl.textContent = title;
      state.editingId = id;
      const form = document.getElementById('employeeForm');
      const row = state.rows.find(r => String(r.id) === String(id));
      form.name.value = row ? (row.name || '') : '';
      form.jobTitle.value = row ? (row.jobTitle || '') : '';
      form.phone.value = row ? (row.phone || '') : '';
      form.email.value = row ? (row.email || '') : '';
      form.address.value = row ? (row.address || '') : '';
      modal.classList.add('open');
      state.modalOpen = true;
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('open');
      state.modalOpen = false;
      state.editingId = null;
      document.getElementById('employeeForm').reset();
    }

    async function submitEmployee(e) {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value.trim(),
        jobTitle: form.jobTitle.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim(),
        address: form.address.value.trim(),
        active: true
      };

      if (!payload.name || !payload.jobTitle) {
        alert('Name and Department are required.');
        return;
      }

      const shouldSave = confirm(state.editingId ? 'Warning: Saving changes will update this employee record. Continue?' : 'Warning: Creating this employee will add a new record. Continue?');
      if (!shouldSave) return;

      try {
        if (state.editingId) {
          const { error } = await client.from('employee').update(payload).eq('id', state.editingId);
          if (error) throw error;
        } else {
          const { error } = await client.from('employee').insert([payload]);
          if (error) throw error;
        }
        closeModal();
        await loadRows();
      } catch (err) {
        alert('Save failed: ' + err.message);
      }
    }

    document.getElementById('addBtn').addEventListener('click', () => openModal('Add Employee'));
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
    document.getElementById('employeeForm').addEventListener('submit', submitEmployee);
    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderTable();
    });

    function autoConnect() {
      if (typeof window.ENV_SUPABASE_URL !== 'undefined' && typeof window.ENV_SUPABASE_KEY !== 'undefined') {
        const url = window.ENV_SUPABASE_URL;
        const key = window.ENV_SUPABASE_KEY;
        if (url && key) {
          connect(url, key).catch(err => setStatus('Auto-connect failed: ' + err.message));
          return;
        }
      }
      setStatus('Supabase is not configured on the server. Set SUPABASE_PROJECT_URL and SUPABASE_PUBLISHABLE_KEY in the .env file.');
    }

    autoConnect();
  </script>
</body>
</html>
