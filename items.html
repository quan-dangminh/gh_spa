<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Items</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --sidebar-bg: #101f33;
      --sidebar-bg-2: #172c4a;
      --sidebar-text: #dfeaf8;
      --sidebar-muted: #9eb4d0;
      --page-bg: #eef2f5;
      --panel-bg: #f9fafb;
      --card-bg: #fff;
      --border: #e3e8ef;
      --text: #1f2f3f;
      --muted: #69798c;
      --accent: #a37ae4;
      --accent-soft: #f2ebff;
      --danger: #d76161;
      --danger-soft: #fff0f0;
      --shadow: 0 8px 22px rgba(16, 31, 51, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--page-bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 230px; background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg-2)); color: var(--sidebar-text); padding: 18px 16px 14px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .brand-mark { width: 22px; height: 22px; border-radius: 8px; background: linear-gradient(135deg, #8e70f3, #c6a4ff); position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
    .brand-mark::before { content: ''; position: absolute; inset: 0; transform: rotate(45deg) scale(.72); border-radius: 7px; background: rgba(255,255,255,0.15); }
    .brand-name { font-size: 1.1rem; font-weight: 700; }
    .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: var(--sidebar-text); opacity: 0.9; }
    .nav a.active { background: rgba(255,255,255,0.08); }
    .nav-icon { width: 18px; text-align: center; color: var(--sidebar-muted); }
    .divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 12px 0; }
    .usercard { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px 8px 4px; border-top: 1px solid rgba(255,255,255,0.08); }
    .logout-btn { width: 100%; margin-top: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: var(--sidebar-text); border-radius: 10px; padding: 10px 12px; font-weight: 700; cursor: pointer; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #d7cbff, #9e85f4); display: grid; place-items: center; color: #fff; font-weight: 700; }
    .name { font-size: 0.92rem; font-weight: 700; }
    .mail { font-size: 0.73rem; color: var(--sidebar-muted); }
    .content { flex: 1; padding: 28px 26px 22px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .toolbar h1 { margin: 0; font-size: 2.1rem; letter-spacing: -0.05em; }
    .actions { display: flex; align-items: center; gap: 16px; }
    .search { display: flex; align-items: center; gap: 8px; width: 260px; background: rgba(255,255,255,0.7); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--muted); }
    .search input { width: 100%; border: none; outline: none; background: transparent; font-size: 0.95rem; }
    .primary-btn, .secondary-btn, .danger-btn { border: none; border-radius: 10px; padding: 11px 18px; font-size: 0.96rem; font-weight: 700; cursor: pointer; }
    .primary-btn { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(163,122,228,0.25); }
    .secondary-btn { background: var(--accent-soft); color: var(--accent); }
    .danger-btn { background: var(--danger-soft); color: var(--danger); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.7fr); gap: 18px; }
    .table-card, .detail-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
    .table-card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: #f8fafc; border-bottom: 1px solid var(--border); padding: 12px 14px; }
    tbody td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 0.96rem; }
    tbody tr:hover { background: #fafcff; }
    .row-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .mini-btn { border: none; padding: 7px 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .mini-btn.edit { background: var(--accent-soft); color: var(--accent); }
    .mini-btn.delete { background: var(--danger-soft); color: var(--danger); }
    .detail-card { min-height: 420px; padding: 18px; }
    .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .detail-header h3 { margin: 0; font-size: 1.08rem; }
    .detail-empty { color: var(--muted); line-height: 1.6; }
    .detail-info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { background: #f7f9fb; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .field-label { display: block; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .field-value { font-weight: 700; color: var(--text); }
    .panel-actions { display: flex; gap: 8px; margin-top: 12px; }
    .panel-actions .secondary-btn { flex: 1; }
    .panel-actions .danger-btn { flex: 1; }
    .modal { position: fixed; inset: 0; background: rgba(15, 23, 31, 0.46); display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { width: min(760px, 100%); background: white; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,0.2); padding: 20px 22px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-header h2 { margin: 0; font-size: 1.5rem; letter-spacing: -0.04em; }
    .close-btn { border: none; background: transparent; font-size: 1.7rem; color: var(--muted); cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
    .form-field input, .form-field select { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.96rem; background: #fdfdfd; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    @media (max-width: 980px) { .workspace { grid-template-columns: 1fr; } .toolbar { flex-wrap: wrap; gap: 12px; } .actions { width: 100%; justify-content: space-between; } .search { flex: 1; max-width: 320px; } }
    @media (max-width: 760px) { .app { flex-direction: column; } .sidebar { width: 100%; } .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-name">GH Spa & Beauty</div>
      </div>
      <nav class="nav">
        <a href="/"><span class="nav-icon">⌂</span>Dashboard</a>
        <a href="/employee"><span class="nav-icon">👥</span>Employees</a>
        <a href="/customers"><span class="nav-icon">👤</span>Customers</a>
        <a href="/items" class="active"><span class="nav-icon">▣</span>Items</a>
        <a href="/invoices"><span class="nav-icon">🧾</span>Invoices</a>
        <div class="divider"></div>
        <a href="#"><span class="nav-icon">▤</span>Reports</a>
        <a href="#"><span class="nav-icon">⚙</span>Settings</a>
      </nav>
      <div class="usercard">
        <div class="avatar">A</div>
        <div>
          <div class="name">Admin User</div>
          <div class="mail">admin@bizflow.com</div>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </aside>

    <main class="content">
      <div class="toolbar">
        <h1>Items</h1>
        <div class="actions">
          <label class="search"><span>⌕</span><input id="searchInput" placeholder="Search items..." /></label>
          <button class="primary-btn" id="addBtn">+ Add Item</button>
        </div>
      </div>

      <div class="workspace">
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Group</th>
                <th>Price</th>
                <th>Usage</th>
                <th>Period</th>
                <th>Created By</th>
                <th style="width: 130px;">Actions</th>
              </tr>
            </thead>
            <tbody id="rowsBody"></tbody>
          </table>
        </div>

        <aside class="detail-card" id="detailCard">
          <div class="detail-empty">Select an item to view details and actions.</div>
        </aside>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Add Item</h2>
        <button class="close-btn" id="closeModalBtn" aria-label="Close">×</button>
      </div>
      <form id="itemForm">
        <div class="form-grid">
          <div class="form-field">
            <label>Item Name</label>
            <input name="name" required />
          </div>
          <div class="form-field">
            <label>Group</label>
            <select name="item_group">
              <option value="">(select)</option>
              <option>DỊCH VỤ</option>
              <option>GÓI DỊCH VỤ</option>
              <option>SẢN PHẨM</option>
            </select>
          </div>
          <div class="form-field">
            <label>Sub Group</label>
            <select name="item_sub_group">
              <option value="">(select)</option>
              <option>SẢN PHẨM</option>
              <option>A - DỊCH VỤ CHĂM SÓC DA MẶT</option>
              <option>B - BODY CARE</option>
              <option>C - DỊCH VỤ TRIỆT LÔNG</option>
              <option>D - DỊCH VỤ VI KIM</option>
              <option>E - DỊCH VỤ LASER</option>
              <option>F - DỊCH VỤ PHUN THÊU THẨM MỸ</option>
              <option>LIỆU TRÌNH CẤY MI SINH HỌC</option>
              <option>COMBO MESO</option>
            </select>
          </div>
          <div class="form-field">
            <label>Price</label>
            <input name="price" type="number" step="5000" />
          </div>
          <div class="form-field">
            <label>Number of Usage</label>
            <input name="number_of_usage" type="number" />
          </div>
          <div class="form-field">
            <label>Period</label>
            <input name="period" type="number" />
          </div>
          <div class="form-field full">
            <label>Created By</label>
            <select name="created_by"></select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const { createClient } = supabase;
    let client = null;
    let state = { rows: [], selectedId: null, editingId: null, search: '' };

    function readCurrentUser() {
      try {
        const value = JSON.parse(localStorage.getItem('bizflow-current-user') || 'null');
        window.__CURRENT_USER__ = value || {};
        return value || null;
      } catch (error) {
        window.__CURRENT_USER__ = {};
        return null;
      }
    }

    function applyUserProfile() {
      const user = window.__CURRENT_USER__ || {};
      const fullName = user.fullName || user.name || user.email || 'User';
      const email = user.email || '';
      const initials = (fullName || 'U').trim().charAt(0).toUpperCase();

      document.querySelectorAll('.avatar, .usercard .avatar, .user-card .avatar').forEach(el => { el.textContent = initials; });
      document.querySelectorAll('.usercard .name, .user-card .name').forEach(el => { el.textContent = fullName; });
      document.querySelectorAll('.usercard .mail, .user-card .mail').forEach(el => { el.textContent = email || 'No email'; });
    }

    function getCurrentUserLabel() {
      const user = window.__CURRENT_USER__ || {};
      return (user.fullName || user.name || user.email || 'User').trim();
    }

    function ensureAuthenticated() {
      const user = readCurrentUser();
      if (!user || !user.email || !user.name) {
        window.location.href = '/login';
        return null;
      }
      window.__CURRENT_USER__ = user;
      applyUserProfile();
      return user;
    }

    function setStatus(msg) {
      document.getElementById('detailCard').innerHTML = '<div class="detail-empty">' + escapeHtml(msg) + '</div>';
    }

    async function connect(url, key) {
      const user = ensureAuthenticated();
      if (!user) return;
      client = createClient((url || '').trim().replace(/\/+$/, ''), (key || '').trim());
      await Promise.all([loadRows(), loadEmployeeNames()]);
    }

    function bindLogout() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (!logoutBtn) return;
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('bizflow-current-user');
        window.location.href = '/login';
      });
    }

    async function loadEmployeeNames() {
      const selector = document.querySelector('#itemForm select[name="created_by"]');
      if (!selector || !client) return;
      selector.innerHTML = '<option value="">(select employee)</option>';
      try {
        const { data, error } = await client.from('employee').select('name').order('name', { ascending: true });
        if (error) throw error;
        for (const row of data || []) {
          if (!row.name) continue;
          const option = document.createElement('option');
          option.value = row.name;
          option.textContent = row.name;
          selector.appendChild(option);
        }

        const preferred = getCurrentUserLabel();
        if (preferred && ![...selector.options].some(opt => opt.value === preferred)) {
          const option = document.createElement('option');
          option.value = preferred;
          option.textContent = preferred;
          selector.appendChild(option);
        }
        if (preferred) selector.value = preferred;
      } catch (err) {
        console.warn('Could not load employee names:', err);
        selector.innerHTML = '<option value="">Could not load employees</option>';
      }
    }

    async function loadRows() {
      if (!client) return;
      try {
        const { data, error } = await client.from('items').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        state.rows = data || [];
        if (!state.rows.length) state.selectedId = null;
        else if (!state.selectedId || !state.rows.some(r => String(r.id) === String(state.selectedId))) state.selectedId = state.rows[0].id;
        renderTable();
        renderDetail();
      } catch (err) {
        setStatus('Could not load items: ' + err.message);
      }
    }

    function renderTable() {
      const rowsBody = document.getElementById('rowsBody');
      const filtered = state.rows.filter(row => {
        const text = [row.name, row.item_group, row.item_sub_group, row.created_by, row.period].join(' ').toLowerCase();
        return text.includes(state.search.trim().toLowerCase());
      });
      if (!filtered.length) {
        rowsBody.innerHTML = '<tr><td colspan="7" style="padding:20px;color:#69798c;">No items found.</td></tr>';
        return;
      }
      rowsBody.innerHTML = filtered.map((row) => `
        <tr data-id="${row.id}" style="${String(state.selectedId) === String(row.id) ? 'background:#f7fbff;' : ''}">
          <td><strong>${escapeHtml(row.name || '—')}</strong></td>
          <td>${escapeHtml(row.item_group || '—')}</td>
          <td>${escapeHtml(row.price != null ? Number(row.price).toLocaleString() : '—')}</td>
          <td>${escapeHtml(row.number_of_usage != null ? row.number_of_usage : '—')}</td>
          <td>${escapeHtml(row.period || '—')}</td>
          <td>${escapeHtml(row.created_by || '—')}</td>
          <td>
            <div class="row-actions">
              <button class="mini-btn delete" data-action="delete" data-id="${row.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      rowsBody.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        state.selectedId = tr.dataset.id;
        renderTable();
        renderDetail();
      }));
      rowsBody.querySelectorAll('button[data-action="delete"]').forEach(btn => btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Warning: Deleting this item is permanent. Continue?')) return;
        try {
          const { error } = await client.from('items').delete().eq('id', btn.dataset.id);
          if (error) throw error;
          await loadRows();
        } catch (err) { alert('Delete failed: ' + err.message); }
      }));
    }

    function renderDetail() {
      const detailCard = document.getElementById('detailCard');
      const selected = state.rows.find(r => String(r.id) === String(state.selectedId));
      if (!selected) {
        detailCard.innerHTML = '<div class="detail-empty">Select an item to view details and actions.</div>';
        return;
      }
      detailCard.innerHTML = `
        <div class="detail-header">
          <h3>${escapeHtml(selected.name || 'Item')}</h3>
        </div>
        <div class="detail-info-grid">
          <div class="field"><span class="field-label">Name</span><span class="field-value">${escapeHtml(selected.name || '—')}</span></div>
          <div class="field"><span class="field-label">Group</span><span class="field-value">${escapeHtml(selected.item_group || '—')}</span></div>
          <div class="field"><span class="field-label">Sub Group</span><span class="field-value">${escapeHtml(selected.item_sub_group || '—')}</span></div>
          <div class="field"><span class="field-label">Price</span><span class="field-value">${selected.price != null ? Number(selected.price).toLocaleString() : '—'}</span></div>
          <div class="field"><span class="field-label">Usage</span><span class="field-value">${escapeHtml(selected.number_of_usage != null ? selected.number_of_usage : '—')}</span></div>
          <div class="field"><span class="field-label">Period</span><span class="field-value">${escapeHtml(selected.period || '—')}</span></div>
          <div class="field"><span class="field-label">Created By</span><span class="field-value">${escapeHtml(selected.created_by || '—')}</span></div>
          <div class="field"><span class="field-label">Created</span><span class="field-value">${selected.created_at ? new Date(selected.created_at).toLocaleDateString() : '—'}</span></div>
        </div>
        <div class="panel-actions">
          <button class="secondary-btn" id="detailEditFooterBtn">Edit</button>
          <button class="danger-btn" id="detailDeleteBtn">Delete</button>
        </div>
      `;
      document.getElementById('detailEditFooterBtn').addEventListener('click', () => openModal('Edit Item', selected.id));
      document.getElementById('detailDeleteBtn').addEventListener('click', async () => {
        if (!confirm('Warning: Deleting this item is permanent. Continue?')) return;
        try {
          const { error } = await client.from('items').delete().eq('id', selected.id);
          if (error) throw error;
          await loadRows();
        } catch (err) { alert('Delete failed: ' + err.message); }
      });
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function openModal(title, id = null) {
      const modal = document.getElementById('modal');
      const form = document.getElementById('itemForm');
      const row = state.rows.find(r => String(r.id) === String(id));
      document.getElementById('modalTitle').textContent = title;
      state.editingId = id;
      form.name.value = row ? (row.name || '') : '';
      form.item_group.value = row ? (row.item_group || '') : '';
      form.item_sub_group.value = row ? (row.item_sub_group || '') : '';
      form.price.value = row ? (row.price ?? '') : '';
      form.number_of_usage.value = row ? (row.number_of_usage ?? '') : '';
      form.period.value = row ? (row.period ?? '') : '';
      form.created_by.value = row ? (row.created_by || getCurrentUserLabel()) : getCurrentUserLabel();
      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      state.editingId = null;
      document.getElementById('itemForm').reset();
    }

    async function submitItem(e) {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value.trim(),
        item_group: form.item_group.value,
        item_sub_group: form.item_sub_group.value,
        price: Number(form.price.value || 0),
        number_of_usage: Number(form.number_of_usage.value || 0),
        period: String(form.period.value || '').trim(),
        created_by: form.created_by.value.trim()
      };
      if (!payload.name || !payload.created_by) { alert('Name and Created By are required.'); return; }
      const proceed = confirm(state.editingId ? 'Warning: Saving changes will update this item record. Continue?' : 'Warning: Creating this item will add a new record. Continue?');
      if (!proceed) return;
      try {
        if (state.editingId) {
          const { error } = await client.from('items').update(payload).eq('id', state.editingId);
          if (error) throw error;
        } else {
          const { error } = await client.from('items').insert([payload]);
          if (error) throw error;
        }
        closeModal();
        await loadRows();
      } catch (err) { alert('Save failed: ' + err.message); }
    }

    document.getElementById('addBtn').addEventListener('click', () => openModal('Add Item'));
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
    document.getElementById('itemForm').addEventListener('submit', submitItem);
    document.getElementById('searchInput').addEventListener('input', (e) => { state.search = e.target.value; renderTable(); });
    bindLogout();

    function autoConnect() {
      if (typeof window.ENV_SUPABASE_URL !== 'undefined' && typeof window.ENV_SUPABASE_KEY !== 'undefined') {
        const url = window.ENV_SUPABASE_URL;
        const key = window.ENV_SUPABASE_KEY;
        if (url && key) {
          connect(url, key).catch(err => setStatus('Auto-connect failed: ' + err.message));
          return;
        }
      }
      setStatus('Supabase is not configured on the server. Set SUPABASE_PROJECT_URL and SUPABASE_PUBLISHABLE_KEY in the .env file.');
    }

    autoConnect();
  </script>
</body>
</html>
